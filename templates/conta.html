<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta · Sistema DP</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-8 font-sans text-slate-800 antialiased">
    <div class="w-full max-w-sm">
        <div class="mb-6 text-center">
            <img src="/static/img/logo-sepres.jpeg" alt="SEPRES" class="mx-auto mb-3 h-16 w-auto object-contain">
            <p class="text-sm text-slate-500">Minha conta · {{ current_user.username }}</p>
        </div>
        <div class="card p-6">
            {% if erro %}<div class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-sm text-rose-700">{{ erro }}</div>{% endif %}
            {% if msg %}<div class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2.5 text-sm text-emerald-700">{{ msg }}</div>{% endif %}
            <form method="post" class="space-y-4">
                <div>
                    <label class="label" for="email">E-mail (para recuperar a senha)</label>
                    <input class="input" type="email" id="email" name="email" value="{{ current_user.email or '' }}" autocomplete="email">
                </div>
                <div>
                    <label class="label" for="nova_senha">Nova senha <span class="text-slate-400">(opcional)</span></label>
                    <input class="input" type="password" id="nova_senha" name="nova_senha" autocomplete="new-password">
                </div>
                <div>
                    <label class="label" for="confirma">Confirmar nova senha</label>
                    <input class="input" type="password" id="confirma" name="confirma" autocomplete="new-password">
                </div>
                <div>
                    <label class="label" for="senha_atual">Senha atual <span class="text-slate-400">(para confirmar)</span></label>
                    <input class="input" type="password" id="senha_atual" name="senha_atual" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary w-full">Salvar</button>
            </form>
            <div class="mt-4 text-center"><a href="/" class="text-sm text-slate-500 hover:text-sepres-700">Voltar ao sistema</a></div>
        </div>
    </div>
</body>
</html>
