<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Férias · Sistema DP</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/metropolis@5.0.4/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/metropolis@5.0.4/700.css">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <script>if(localStorage.getItem('sidebarCollapsed')==='1'){document.body.classList.add('sidebar-collapsed');}</script>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-40 flex -translate-x-full flex-col border-r border-slate-200 bg-white transition-all duration-200 lg:translate-x-0">
        <div class="side-hdr flex h-16 items-center gap-2.5 border-b border-slate-100 px-4">
            <img src="/static/img/logo-sepres.jpeg" alt="SEPRES" class="side-logo">
        </div>
        <nav class="flex-1 space-y-1 p-3">
            <a href="/" class="side-link" title="Dashboard"><i class="fas fa-chart-line w-5 shrink-0 text-center"></i><span class="side-label">Dashboard</span></a>
            <a href="/colaboradores" class="side-link" title="Colaboradores"><i class="fas fa-users w-5 shrink-0 text-center"></i><span class="side-label">Colaboradores</span></a>
            <a href="/lancamentos" class="side-link" title="Lançamentos"><i class="fas fa-dollar-sign w-5 shrink-0 text-center"></i><span class="side-label">Lançamentos</span></a>
            <a href="/ferias" class="side-link active" title="Férias"><i class="fas fa-umbrella-beach w-5 shrink-0 text-center"></i><span class="side-label">Férias</span></a>
        </nav>
        <div class="border-t border-slate-100 p-3">
            <a href="/conta" class="side-link" title="Minha conta"><i class="fas fa-user-gear w-5 shrink-0 text-center"></i><span class="side-label">Minha conta</span></a>
            <a href="/logout" class="side-link" title="Sair"><i class="fas fa-right-from-bracket w-5 shrink-0 text-center"></i><span class="side-label">Sair</span></a>
        </div>
        <button onclick="collapseSidebar()" title="Recolher menu" class="absolute -right-3 top-20 z-50 hidden h-6 w-6 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-500 shadow-sm transition hover:text-sepres-600 lg:flex">
            <i id="collapseIcon" class="fas fa-angle-left text-xs"></i>
        </button>
    </aside>
    <div id="sidebarBackdrop" class="fixed inset-0 z-30 hidden bg-slate-900/40 lg:hidden" onclick="toggleSidebar()"></div>

    <div class="app-shell">
        <!-- Barra superior (mobile) -->
        <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/80 px-4 backdrop-blur lg:hidden">
            <button onclick="toggleSidebar()" class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-600 hover:bg-slate-100"><i class="fas fa-bars"></i></button>
            <img src="/static/img/logo-sepres.jpeg" alt="SEPRES" class="h-7 w-auto object-contain">
        </header>

        <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
            <div class="mb-8">
                <h1 class="font-heading text-2xl font-bold tracking-tight text-slate-900">Férias</h1>
                <p class="mt-1 text-sm text-slate-500">Controle de quem tira férias e em quais dias. O período aparece no Dashboard, na competência correspondente.</p>
            </div>

            <div class="card mb-6 overflow-hidden">
                <div class="flex items-center gap-2 border-b border-slate-200 px-6 py-4 font-heading text-sm font-semibold text-slate-700">
                    <i class="fas fa-umbrella-beach text-sepres-600"></i> <span id="formFeriasTitulo">Registrar férias</span>
                </div>
                <form class="p-6" id="formFerias" autocomplete="off">
                    <input type="hidden" id="feriasEditId">
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
                        <div class="md:col-span-2">
                            <label class="label">Colaborador *</label>
                            <select class="input" id="feriasColaborador" required><option value="">Selecione</option></select>
                        </div>
                        <div>
                            <label class="label">Início *</label>
                            <input type="date" class="input" id="feriasInicio" required>
                        </div>
                        <div>
                            <label class="label">Fim *</label>
                            <input type="date" class="input" id="feriasFim" required>
                        </div>
                        <div class="md:col-span-4">
                            <label class="label">Observações</label>
                            <input type="text" class="input" id="feriasObs" maxlength="255" placeholder="Opcional">
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end gap-3">
                        <button type="button" class="btn-secondary" onclick="limparFormFerias()">Cancelar</button>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Salvar</button>
                    </div>
                </form>
            </div>

            <div class="card overflow-hidden">
                <div class="flex flex-wrap items-center gap-3 border-b border-slate-200 px-6 py-4">
                    <span class="font-heading text-sm font-semibold text-slate-700"><i class="fas fa-list-ul mr-1.5 text-sepres-600"></i> Períodos registrados</span>
                    <div class="ml-auto flex flex-wrap items-center gap-2">
                        <input type="month" class="input mes-ptbr compact w-40" id="feriasFiltroMes" onchange="renderizarFerias()" title="Filtrar por mês">
                        <select class="input compact w-40" id="feriasFiltroSituacao" onchange="renderizarFerias()">
                            <option value="">Todas</option>
                            <option value="Em andamento">Em andamento</option>
                            <option value="Agendadas">Agendadas</option>
                            <option value="Concluídas">Concluídas</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                            <tr><th class="px-4 py-3">Colaborador</th><th class="px-4 py-3">Período</th><th class="px-4 py-3">Dias</th><th class="px-4 py-3">Situação</th><th class="px-4 py-3">Observações</th><th class="px-4 py-3"></th></tr>
                        </thead>
                        <tbody id="feriasTabela"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('formFerias').addEventListener('submit', salvarFerias);
    </script>
</body>
</html>
