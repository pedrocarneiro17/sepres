<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha · Sistema DP</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 font-sans text-slate-800 antialiased">
    <div class="w-full max-w-sm">
        <div class="mb-6 flex flex-col items-center gap-3 text-center">
            <img src="/static/img/logo-sepres.jpeg" alt="SEPRES" class="h-16 w-auto object-contain">
            <p class="text-sm text-slate-500">Redefinição de senha</p>
        </div>

        <div class="card p-6">
            {% if enviado %}
            <div class="flex items-start gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2.5 text-sm text-emerald-700">
                <i class="fas fa-circle-check mt-0.5"></i>
                <span>Se o e-mail estiver cadastrado, enviaremos um link para redefinir a senha. Ele vale por 30 minutos.</span>
            </div>
            {% else %}
            <form method="post" class="space-y-4">
                <div>
                    <label class="label" for="email">E-mail cadastrado</label>
                    <input class="input" type="email" id="email" name="email" autocomplete="email" required autofocus>
                </div>
                <button type="submit" class="btn-primary w-full">Enviar link</button>
            </form>
            {% endif %}
            <div class="mt-4 text-center"><a href="/login" class="text-sm text-slate-500 hover:text-sepres-700">Voltar ao login</a></div>
        </div>
    </div>
</body>
</html>
